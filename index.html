<style>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const db=getDatabase(initializeApp({apiKey:"AIzaSyB-AYAJbb3kuwveK6xe42nm5j5e45H41Cc",authDomain:"casinogame-45148.firebaseapp.com",databaseURL:"https://casinogame-45148-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"casinogame-45148",storageBucket:"casinogame-45148.firebasestorage.app",messagingSenderId:"957225764064",appId:"1:957225764064:web:3b775930b25ff5030ffc85"}));
const $=id=>document.getElementById(id),W=1000,H=500,C=38,R=14.5,PR0=25,FR0=.9865;
const POCK=[[C,C],[W/2,C-4],[W-C,C],[C,H-C],[W/2,H-C+4],[W-C,H-C]].map(([x,y])=>({x,y}));

// ===== audio =====
let AC=null,mute=false;
function tone(f0,f1,d,v,t="sine"){if(mute)return;AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}
// ===== cheats =====
const CH=[["longGuide","Garis bidik panjang + pantulan"],["autoAim","Auto Aim"],["maxPower","Power selalu 100%"],["megaPower","Mega Power x1.6"],["lowFric","Gesekan rendah"],["bouncy","Bantalan super mental"],["bigPocket","Lubang jumbo"],["magnet","Magnet lubang"],["slowmo","Slow motion"],["noScratch","Bola putih anti masuk"],["noFoul","Anti foul"],["extraTurn","Giliran tanpa henti"]];
const cheats={};let unlocked=false;
$("chl").innerHTML=CH.map(([k,l])=>`<div class="ch"><span>${l}</span><div class="sw" data-k="${k}"></div></div>`).join("");
$("chl").onclick=e=>{const s=e.target.closest(".sw");if(!s)return;cheats[s.dataset.k]=!cheats[s.dataset.k];s.classList.toggle("on",cheats[s.dataset.k])};
const openMod=()=>{$("mod").classList.add("on");$("mpw").style.display=unlocked?"none":"block";$("mls").style.display=unlocked?"block":"none";$("pw").value=""};
["modH","modL","modA"].forEach(i=>$(i).onclick=openMod);
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>$("mod").classList.remove("on"));
$("pwok").onclick=()=>{if($("pw").value==="cheat123"){unlocked=true;openMod();note("Mod menu aktif")}else note("Password salah")};
$("win").onclick=async()=>{if(!S.room||S.room.status!=="playing")return note("Hanya saat bermain");const t=S.room.players[S.uid].team;await update(ref(db,`billiard_rooms/${S.code}`),{status:"finished",winnerTeam:t,winReason:"Menang via Mod Menu"});$("mod").classList.remove("on")};
// ===== state =====
const S={uid:localStorage.apx_uid||"u_"+Math.random().toString(36).slice(2,10),mode:"2v2",code:null,room:null,balls:[],sim:false,lastShot:null,aim:0,power:0,drag:false,bih:false,spin:{x:0,y:0}};
localStorage.apx_uid=S.uid;$("nm").value=localStorage.apx_name||"";
const orient={};const I3=()=>[1,0,0,0,1,0,0,0,1];
let tt;function note(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2200)}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));$(id).classList.add("on");if(id==="arena")fit()}
onValue(ref(db,".info/connected"),s=>$("net").textContent=s.val()?"Online":"Offline");
const tg=()=>{mute=!mute;$("sfx").textContent=$("sfx2").textContent=mute?"MUTE":"SFX ON"};$("sfx").onclick=$("sfx2").onclick=tg;
document.querySelectorAll(".mode button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".mode button").forEach(x=>x.classList.remove("on"));b.classList.add("on");S.mode=b.dataset.m});
// landscape lock + fullscreen on first touch
addEventListener("pointerdown",()=>{const d=document.documentElement;(d.requestFullscreen?d.requestFullscreen():Promise.reject()).then(()=>screen.orientation?.lock?.("landscape")).catch(()=>{})},{once:true});
function rack(){const b=[{id:0,x:260,y:H/2,vx:0,vy:0,potted:false}],o=[1,9,2,10,8,3,11,4,12,5,13,6,14,7,15];let i=0;for(let c=0;c<5;c++)for(let r=0;r<=c;r++)b.push({id:o[i++],x:720+c*R*1.76,y:H/2-c*R*1.02+r*R*2.04,vx:0,vy:0,potted:false});return b}
// ===== room =====
let rr=null;
function prof(){const n=$("nm").value.trim();if(!n){note("Masukkan nama dulu");return null}localStorage.apx_name=n;return n}
$("mk").onclick=async()=>{const name=prof();if(!name)return;const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let code="";for(let i=0;i<6;i++)code+=ch[Math.random()*ch.length|0];
 await set(ref(db,`billiard_rooms/${code}`),{code,mode:S.mode,hostId:S.uid,status:"lobby",turnOrder:[],turnIndex:0,alphaGroup:null,omegaGroup:null,ballInHand:false,winnerTeam:null,winReason:"",lastShot:null,balls:rack(),players:{[S.uid]:{id:S.uid,name,team:"alpha",ready:true,joinedAt:Date.now()}}});sub(code)};
$("jn").onclick=async()=>{const name=prof();if(!name)return;const code=$("cd").value.trim().toUpperCase();if(code.length!==6)return note("Kode harus 6 karakter");
 const sn=await get(ref(db,`billiard_rooms/${code}`));if(!sn.exists())return note("Meja tidak ditemukan");const r=sn.val(),ps=Object.values(r.players||{}),mx=r.mode==="2v2"?4:2,pt=mx/2;
 if(ps.length>=mx&&!r.players?.[S.uid])return note("Meja penuh");if(r.status==="playing")return note("Pertandingan berlangsung");
 await set(ref(db,`billiard_rooms/${code}/players/${S.uid}`),{id:S.uid,name,team:ps.filter(p=>p.team==="alpha").length<pt?"alpha":"omega",ready:false,joinedAt:Date.now()});sub(code)};
function sub(code){if(rr)off(rr);S.code=code;rr=ref(db,`billiard_rooms/${code}`);onDisconnect(ref(db,`billiard_rooms/${code}/players/${S.uid}`)).remove();
 onValue(rr,async sn=>{if(!sn.exists()){home();return note("Meja ditutup")}const r=sn.val();S.room=r;const ps=Object.values(r.players||{});
  if(!r.players?.[S.uid]){home();return note("Kamu keluar dari meja")}
  if(!r.players[r.hostId]&&ps.length){ps.sort((a,b)=>a.joinedAt-b.joinedAt);if(ps[0].id===S.uid)await update(rr,{hostId:S.uid})}
  if(r.status==="lobby"){$("vic").classList.remove("on");lobby(r,ps);show("lobby")}
  else{show("arena");arena(r,ps);if(r.status==="finished"){const a=r.winnerTeam==="alpha";$("vt").textContent=a?"TEAM ALPHA MENANG":"TEAM OMEGA MENANG";$("vt").style.color=a?"var(--a)":"var(--o)";$("vr").textContent=r.winReason||"";$("vic").classList.add("on")}else $("vic").classList.remove("on")}})}
function lobby(r,ps){const mx=r.mode==="2v2"?4:2,pt=mx/2;$("lm").textContent=r.mode==="2v2"?"TEAM 2V2":"DUEL 1V1";$("lc").textContent=r.code;$("ln").textContent=ps.length+"/"+mx;
 const A=ps.filter(p=>p.team==="alpha").sort((a,b)=>a.joinedAt-b.joinedAt),O=ps.filter(p=>p.team==="omega").sort((a,b)=>a.joinedAt-b.joinedAt);
 const sl=(id,l,c)=>{let h="";for(let i=0;i<pt;i++){const p=l[i];h+=p?`<div class="slot"><div class="av" style="background:${c}">${esc(p.name[0]||"?").toUpperCase()}</div>${esc(p.name)}${p.id===r.hostId?' <small style="color:var(--g)">HOST</small>':""}<span class="rd ${p.ready?"y":""}">${p.ready?"READY":"WAIT"}</span></div>`:`<div class="slot" style="opacity:.4;border:1px dashed #fff5;justify-content:center">Slot kosong</div>`}$(id).innerHTML=h};
 sl("ra",A,"var(--a)");sl("ro",O,"var(--o)");const me=r.players[S.uid];$("rdy").textContent=me.ready?"BATAL":"READY";$("ja").disabled=me.team==="alpha"||A.length>=pt;$("jo").disabled=me.team==="omega"||O.length>=pt;
 const host=r.hostId===S.uid,ok=A.length===pt&&O.length===pt,all=ps.every(p=>p.ready);$("go").style.display=host?"inline-block":"none";$("go").disabled=!(ok&&all);$("lh").textContent=!ok?`Butuh ${pt} pemain per tim`:!all?"Menunggu semua READY...":"Siap! Host bisa mulai."}
$("cp").onclick=()=>{navigator.clipboard?.writeText(S.code);note("Kode disalin")};

$("rdy").onclick=()=>update(ref(db,`billiard_rooms/${S.code}/players/${S.uid}`),{ready:!S.room.players[S.uid].ready});
