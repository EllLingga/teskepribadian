 <div style="display:flex;align-items:center"><div id="hand"></div><button class="b s" id="skip">LEWATI</button></div></section>

<script type="module">

const app=initializeApp({apiKey:"AIzaSyB-AYAJbb3kuwveK6xe42nm5j5e45H41Cc",authDomain:"casinogame-45148.firebaseapp.com",databaseURL:"https://casinogame-45148-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"casinogame-45148",storageBucket:"casinogame-45148.firebasestorage.app",messagingSenderId:"957225764064",appId:"1:957225764064:web:3b775930b25ff5030ffc85"});
const db=getDatabase(app);let UID=null;
const authP=signInAnonymously(getAuth(app)).then(c=>UID=c.user.uid).catch(()=>null);
const $=id=>document.getElementById(id),later=(f,ms)=>setTimeout(f,ms),esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>{document.querySelectorAll(".sc").forEach(s=>s.classList.remove("on"));$(id).classList.add("on")};
let acts={},tt;const dlg=(h,a={})=>{acts=a;$("dg").innerHTML=h;$("ov").classList.add("on")},hide=()=>$("ov").classList.remove("on");
$("dg").onclick=e=>{const k=e.target.dataset.a;if(k&&acts[k])acts[k](e.target.dataset)};

addEventListener("pointerdown",()=>{const d=document.documentElement;(d.requestFullscreen?d.requestFullscreen():Promise.reject()).then(()=>screen.orientation?.lock?.("landscape")).catch(()=>{})},{once:true});

/* ============ ROOM CORE ============ */
const S={g:null,code:null,meta:null,players:{},un:[],host:false,actL:0};
const R=p=>ref(db,`${S.g}_rooms/${S.code}${p?"/"+p:""}`);
const sorted=()=>Object.entries(S.players).sort((a,b)=>a[1].joinedAt-b[1].joinedAt).map(e=>e[0]);
document.querySelectorAll(".gm").forEach(c=>c.onclick=()=>{const g=c.dataset.g;
 dlg(`<h3 class="f" style="color:var(--g);font-size:1.3rem">${g==="snk"?"Ular Tangga":"UNO No Mercy"}</h3>
 <input id="nm" maxlength="14" placeholder="Nickname" value="${esc(localStorage.apx_name||"")}"><input id="cd" maxlength="6" placeholder="Kode meja (untuk gabung)" style="text-transform:uppercase;letter-spacing:.15em">
 <div class="row"><button class="b" data-a="mk">BUAT MEJA</button><button class="b" style="background:linear-gradient(#5cc2ff,#1479d6);color:#04203a" data-a="jn">GABUNG</button><button class="b r" data-a="x">BATAL</button></div>`,
 {x:hide,mk:()=>go(g,0),jn:()=>go(g,1)})});
async function go(g,join){const name=$("nm").value.trim(),code=$("cd").value.trim().toUpperCase();if(!name)return note("Isi nickname dulu");localStorage.apx_name=name;
 await authP;if(!UID)return note("Login anonim gagal — aktifkan Anonymous di Firebase Auth");S.g=g;hide();
 try{if(!join){const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let c="";for(let i=0;i<6;i++)c+=ch[Math.random()*32|0];S.code=c;
   await update(ref(db,`${g}_rooms/${c}`),{meta:{code:c,hostId:UID,status:"lobby",game:g},["players/"+UID]:{name,joinedAt:Date.now()}})}
  else{if(code.length!==6)return note("Kode harus 6 karakter");S.code=code;const m=await get(R("meta"));if(!m.exists())return note("Meja tidak ditemukan");
   const ps=(await get(R("players"))).val()||{};if(!ps[UID]){if(m.val().status!=="lobby")return note("Pertandingan sedang berlangsung");if(Object.keys(ps).length>=4)return note("Meja penuh");await set(R("players/"+UID),{name,joinedAt:Date.now()})}}
  listen()}catch(e){note("Gagal: cek rules Firebase");S.code=null}}
function listen(){S.un.forEach(f=>f());S.un=[];S.meta=null;S.players={};S.actL=0;sq=-1;GS=null;pub=null;hand=[];G=null;
 const L=(p,f)=>S.un.push(onValue(R(p),s=>f(s.val())));onDisconnect(R("players/"+UID)).remove();
 L("meta",m=>{if(!m){if(S.code){leaveLocal();note("Meja ditutup")}return}S.meta=m;S.host=m.hostId===UID;
  if(S.host&&S.g==="uno"&&!S.actL){S.actL=1;hostListen()}route()});
 L("players",p=>{S.players=p||{};if(S.meta&&p&&!p[UID])return leaveLocal();route();if(S.host&&G&&!G.over)dropped()});
 if(S.g==="snk")L("game",g=>{GS=g;snkSync()});else{L("pub",p=>{pub=p;unoSync()});L("hands/"+UID,h=>{hand=h||[];unoSync()})}}
function route(){if(!S.meta)return;if(S.meta.status==="lobby"){lobby();show("lob");hide()}else{show(S.g==="snk"?"snk":"uno");S.g==="snk"?snkSync():unoSync()}}
function lobby(){const u=sorted();$("lg").textContent=S.g==="snk"?"Ular Tangga":"UNO No Mercy";$("lc").textContent=S.code;
 $("lp").innerHTML=u.map((id,i)=>`<div class="pr"><span class="dt" style="background:${PC[i]}"></span>${esc(S.players[id].name)}${id===S.meta.hostId?' <small style="color:var(--g)">HOST</small>':""}${id===UID?' <small>(kamu)</small>':""}</div>`).join("");
 $("go").style.display=S.host?"inline-block":"none";$("go").disabled=u.length<2;$("lh").textContent=u.length<2?"Butuh minimal 2 pemain ("+u.length+"/4)":S.host?"Siap! Tekan MULAI.":"Menunggu host memulai..."}
$("cp").onclick=()=>{navigator.clipboard?.writeText(S.code);note("Kode disalin")};
$("go").onclick=async()=>{if(!S.host)return;if(S.g==="snk")await update(R(),{game:snkFresh(),"meta/status":"playing"});else{unoInit();await update(R(),{"meta/status":"playing"})}};
async function leave(){if(S.code){const u={};if(S.host){Object.keys(S.players).forEach(p=>{u["players/"+p]=null;u["hands/"+p]=null;u["action/"+p]=null});u.pub=null;u.game=null;u.meta=null}else u["players/"+UID]=null;try{await update(R(),u)}catch(e){}}leaveLocal()}
function leaveLocal(){S.un.forEach(f=>f());S.un=[];S.code=null;S.meta=null;S.host=false;G=null;hide();show("menu")}
$("lv").onclick=leave;document.querySelectorAll("[data-home]").forEach(b=>b.onclick=leave);

/* ============ ULAR TANGGA ============ */
const SN={16:6,47:26,49:11,56:53,62:19,64:60,87:24,93:73,95:75,98:78},LD={1:38,4:14,9:31,21:42,28:84,36:44,51:67,71:91,80:100},CS=60,PC=["#ef4444","#3b82f6","#22c55e","#eab308"],DI="⚀⚁⚂⚃⚄⚅";
const xy=n=>{n=Math.max(1,n);let r=Math.floor((n-1)/10),c=(n-1)%10;if(r%2)c=9-c;return[c*CS+CS/2,(9-r)*CS+CS/2]};
const sbg=document.createElement("canvas");sbg.width=sbg.height=600;
(()=>{const g=sbg.getContext("2d");
 for(let n=1;n<=100;n++){const[x,y]=xy(n);g.fillStyle=n===100?"#ffd75e":n%2?"#f4e3b8":"#e0c48a";g.fillRect(x-30,y-30,60,60);g.strokeStyle="#0002";g.strokeRect(x-30,y-30,60,60);g.fillStyle="#5a3a1a";g.font="bold 11px Inter";g.textAlign="left";g.textBaseline="top";g.fillText(n,x-27,y-26)}
 g.font="22px serif";g.textAlign="center";g.textBaseline="middle";g.fillText("🏆",xy(100)[0],xy(100)[1]+6);
 for(const a in LD){const[x1,y1]=xy(+a),[x2,y2]=xy(LD[a]),L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,px=-uy*8,py=ux*8;
  g.strokeStyle="#7a4a1c";g.lineWidth=4;g.lineCap="round";[1,-1].forEach(s=>{g.beginPath();g.moveTo(x1+px*s,y1+py*s);g.lineTo(x2+px*s,y2+py*s);g.stroke()});
  g.strokeStyle="#b97a35";g.lineWidth=3;for(let d=14;d<L-6;d+=20){g.beginPath();g.moveTo(x1+ux*d+px,y1+uy*d+py);g.lineTo(x1+ux*d-px,y1+uy*d-py);g.stroke()}}
 for(const a in SN){const[x1,y1]=xy(+a),[x2,y2]=xy(SN[a]),L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,px=-uy,py=ux,P=[];
  for(let i=0;i<=40;i++){const t=i/40,w=Math.sin(t*Math.PI*3)*16*(1-t*.3);P.push([x1+ux*L*t+px*w,y1+uy*L*t+py*w])}
  for(let i=0;i<40;i++){g.strokeStyle=i%4<2?"#2e8b3e":"#7bd36b";g.lineWidth=11-i*.18;g.lineCap="round";g.beginPath();g.moveTo(...P[i]);g.lineTo(...P[i+1]);g.stroke()}
  g.fillStyle="#2e8b3e";g.beginPath();g.arc(x1,y1,9,0,7);g.fill();[-4,4].forEach(o=>{g.fillStyle="#fff";g.beginPath();g.arc(x1+px*o,y1+py*o-2,2.6,0,7);g.fill();g.fillStyle="#000";g.beginPath();g.arc(x1+px*o,y1+py*o-2,1.2,0,7);g.fill()})}})();
const sc=$("bc").getContext("2d");let GS=null,sq=-1,busy=0,dp=[],cur=[],tg=[],looping=0;
const snkFresh=()=>{const o=sorted();return{order:o,names:o.map(u=>S.players[u].name),pos:o.map(()=>0),turn:0,turnUid:o[0],seq:0,win:-1}};
function loop(){if(S.g!=="snk"||!S.code){looping=0;return}sc.drawImage(sbg,0,0);
 cur.forEach((c,i)=>{c[0]+=(tg[i][0]-c[0])*.22;c[1]+=(tg[i][1]-c[1])*.22});
 [...cur.keys()].sort((a,b)=>(a===GS?.turn)-(b===GS?.turn)).forEach(i=>{const[ox,oy]=[[-9,-9],[9,-9],[-9,9],[9,9]][i],x=cur[i][0]+ox,y=cur[i][1]+oy;sc.fillStyle="#0005";sc.beginPath();sc.ellipse(x+2,y+9,9,4,0,0,7);sc.fill();
  const gr=sc.createRadialGradient(x-3,y-4,2,x,y,11);gr.addColorStop(0,"#fff");gr.addColorStop(.3,PC[i]);gr.addColorStop(1,"#000a");sc.fillStyle=gr;sc.beginPath();sc.arc(x,y,10,0,7);sc.fill();sc.strokeStyle="#fff";sc.lineWidth=1.5;sc.stroke()});
 requestAnimationFrame(loop)}
function sbar(){const g=GS;if(!g)return;$("pl").innerHTML=g.order.map((u,i)=>`<div class="pr ${i===g.turn&&g.win<0?"t":""}"><span class="dt" style="background:${PC[i]}"></span>${esc(g.names[i])}${u===UID?" (kamu)":""}<span style="margin-left:auto;color:#9ab">${dp[i]||"START"}</span></div>`).join("");
 $("sl").textContent=g.win>=0?"":(g.order[g.turn]===UID?"Giliranmu! Ketuk dadu":"Giliran "+g.names[g.turn])}
function snkSync(){const g=GS;if(!g||!S.meta||S.meta.status!=="playing")return;
 if(sq<0||g.seq===0||g.seq<sq){sq=g.seq;busy=0;dp=[...g.pos];cur=dp.map(p=>[...xy(p)]);tg=dp.map(p=>[...xy(p)]);hide();if(!looping){looping=1;loop()}sbar();$("dice").textContent="🎲";if(g.win>=0)win();return}
 if(g.seq>sq){sq=g.seq;const e=g.ev;if(!e)return;busy=1;$("dice").textContent=DI[e.v-1];let i=e.from;
  const done=()=>{busy=0;dp=[...g.pos];sbar();if(g.win>=0)win()};
  const jump=()=>{if(e.to!==e.mid)later(()=>{$("sl").textContent=SN[e.mid]?"🐍 Dimakan ular!":"🪜 Naik tangga!";dp[e.p]=e.to;tg[e.p]=xy(e.to);sbar();later(done,900)},450);else done()};
  if(e.mid===e.from){$("sl").textContent="Butuh angka pas!";later(done,700)}else{const iv=setInterval(()=>{i++;dp[e.p]=i;tg[e.p]=xy(i);sbar();if(i>=e.mid){clearInterval(iv);jump()}},230)}}
 else sbar()}
function win(){later(()=>dlg(`<div style="font-size:3rem">🏆</div><h2 class="f" style="color:var(--g)">${esc(GS.names[GS.win])} MENANG!</h2><div class="row">${S.host?'<button class="b" data-a="again">MAIN LAGI</button>':'<small style="color:#9ab">Menunggu host...</small>'}<button class="b r" data-a="x">KELUAR</button></div>`,{again:()=>update(R(),{game:snkFresh()}),x:leave}),400)}
$("dice").onclick=()=>{const g=GS;if(!g||busy||g.win>=0||g.order[g.turn]!==UID)return;busy=1;let k=0;
 const iv=setInterval(()=>{$("dice").textContent=DI[Math.random()*6|0];if(++k>9){clearInterval(iv);const v=1+Math.random()*6|0;$("dice").textContent=DI[v-1];
  const p=g.turn,from=g.pos[p],to=from+v,mid=to>100?from:to,j=(mid>from&&mid<100)?(SN[mid]||LD[mid]||0):0,fin=j||mid,pos=[...g.pos];pos[p]=fin;
  const w=fin===100?p:-1,turn=w>=0?p:(v===6?p:(p+1)%g.order.length);
  update(R("game"),{pos,turn,turnUid:g.order[turn],seq:g.seq+1,ev:{p,v,from,mid,to:fin},win:w}).catch(()=>{busy=0;note("Gagal kirim langkah")})}},65)};

/* ============ UNO NO MERCY ============ */
const CL={R:"#e53935",Y:"#fbc02d",G:"#43a047",B:"#1e88e5"},DV={"+2":2,"+4":4,"W+R4":4,"W+6":6,"W+10":10};let G=null,pub=null,hand=[],shown=0,aseq=0;
const lab=c=>({R:"⇄",S:"⊘",SE:"⊘⊘",DA:"✖","W+R4":"⇄+4","W+6":"+6","W+10":"+10",CR:"🎲"}[c.v]||c.v);
const topOf=s=>s.top||s.disc[s.disc.length-1],ok=(c,s)=>s.pend?DV[c.v]>=s.pmin:(c.c==="W"||c.c===s.col||c.v===topOf(s).v);
function mk(){const d=[];for(const c of"RYGB"){for(let i=0;i<10;i++)d.push({c,v:""+i},{c,v:""+i});for(const v of["+2","+4","R","S","SE","DA"])d.push({c,v},{c,v})}
 for(let i=0;i<4;i++)d.push({c:"W",v:"W+R4"},{c:"W",v:"W+6"},{c:"W",v:"W+10"},{c:"W",v:"CR"});return shuf(d)}
/* --- engine (hanya berjalan di HOST) --- */
const act=()=>[...Array(G.n).keys()].filter(i=>!G.out[i]),nx=p=>{do p=(p+G.dir+G.n)%G.n;while(G.out[p]);return p},msg=t=>G.log=t;
function publish(){const u={pub:{cur:G.cur,dir:G.dir,col:G.col,pend:G.pend,pmin:G.pmin,top:topOf(G),cnt:G.h.map(h=>h.length),out:[...Array(G.n).keys()].map(i=>G.out[i]?1:0),deckN:G.deck.length,log:G.log||"",over:G.over?1:0,wtxt:G.wtxt||"",names:G.names,uids:G.uids,drew:G.drew?1:0,seq:++G.seq}};
 G.uids.forEach((id,i)=>u["hands/"+id]=G.h[i].length?G.h[i]:null);update(R(),u).catch(()=>note("Gagal sinkron (cek rules)"))}
function unoInit(){const us=sorted(),n=us.length;G={n,uids:us,names:us.map(u=>S.players[u].name),deck:mk(),disc:[],h:[],cur:0,dir:1,col:"",pend:0,pmin:0,out:[],rou:0,drew:0,over:0,seq:0,log:"Game dimulai!",wtxt:""};
 for(let i=0;i<n;i++)G.h.push(G.deck.splice(0,7));let c;do{c=G.deck.pop();if(!/^\d$/.test(c.v)){G.deck.unshift(c);c=null}}while(!c);G.disc.push(c);G.col=c.c;turn()}
function dr(p){if(!G.deck.length){const t=G.disc.pop();G.deck=shuf(G.disc);G.disc=[t]}const c=G.deck.pop();if(c)G.h[p].push(c);return c}
function out(p,why){G.out[p]=1;G.deck=shuf(G.deck.concat(G.h[p]));G.h[p]=[];msg(G.names[p]+why)}
const mercy=p=>{if(G.h[p].length>=25){out(p," tereliminasi (25 kartu)!");return 1}};
function chk(){const a=act();if(a.length===1){fin(a[0]);return 1}}
function fin(w){G.over=1;G.wtxt=G.names[w]+" menang! 🏆";publish()}
function dropped(){let ch=0;G.uids.forEach((u,i)=>{if(!S.players[u]&&!G.out[i]){out(i," keluar dari game");ch=1;if(G.cur===i)G.cur=nx(i)}});if(ch){if(chk())return;publish();if(G.pend)later(turn,800)}}
function turn(){if(!G||G.over)return;const p=G.cur,h=G.h[p];G.drew=0;
 if(G.rou){let c;do{c=dr(p)}while(c&&c.c!==G.col&&h.length<25);G.rou=0;msg(G.names[p]+" menarik kartu sampai dapat warna!");if(mercy(p)){if(chk())return;G.cur=nx(p);publish();return later(turn,1000)}}
 if(G.pend&&!h.some(c=>ok(c,G))){const k=G.pend;for(let i=0;i<k;i++)dr(p);G.pend=0;G.pmin=0;msg(G.names[p]+" menarik "+k+" kartu!");mercy(p);if(chk())return;G.cur=nx(p);publish();return later(turn,1200)}
 publish()}
function play(p,i,o){const c=G.h[p].splice(i,1)[0];G.disc.push(c);G.col=c.c==="W"?(CL[o.col]?o.col:"R"):c.c;let again=false,skip2=false;const v=c.v;
 msg(`${G.names[p]} main ${lab(c)}${c.c==="W"?" → warna baru":""}`);
 if(v==="DA"){const m=G.h[p].filter(x=>x.c===c.c);G.h[p]=G.h[p].filter(x=>x.c!==c.c);G.disc.push(...m)}
 if(v==="R"||v==="W+R4"){G.dir*=-1;if(v==="R"&&act().length===2)again=true}
 if(v==="S")skip2=true;if(v==="SE")again=true;
 if(DV[v]){G.pend+=DV[v];G.pmin=DV[v]}
 if(v==="CR")G.rou=1;
 if(v==="7"&&o.t!=null&&o.t!==p&&!G.out[o.t]){[G.h[p],G.h[o.t]]=[G.h[o.t],G.h[p]];msg(G.names[p]+" tukar kartu dengan "+G.names[o.t])}
 if(v==="0"){const a=act(),old=a.map(i=>G.h[i]);a.forEach((x,k)=>G.h[a[(k+(G.dir>0?1:a.length-1))%a.length]]=old[k]);msg("Kartu 0! Semua tangan berputar")}
 if(!G.h[p].length)return fin(p);
 G.cur=again?p:(skip2?nx(nx(p)):nx(p));turn()}
function proc(u,a){if(!G||G.over)return;const p=G.uids.indexOf(u);if(p<0||G.cur!==p||G.out[p])return;
 if(a.type==="play"){const c=G.h[p][a.i];if(!c||!ok(c,G))return;play(p,a.i,{col:a.col,t:a.t})}
 else if(a.type==="draw"){if(G.pend||G.drew)return;let c;do{c=dr(p)}while(c&&!ok(c,G)&&G.h[p].length<25);G.drew=1;msg(G.names[p]+" menarik kartu");
  if(mercy(p)){if(chk())return;G.cur=nx(p);publish();return later(turn,900)}if(!c||!ok(c,G)){G.cur=nx(p);publish();return later(turn,900)}publish()}
 else if(a.type==="skip"){if(!G.drew)return;G.cur=nx(p);turn()}}
let first=1;const PS={};
function hostListen(){first=1;S.un.push(onValue(R("action"),s=>{const v=s.val()||{};for(const u in v){const a=v[u];if(first)PS[u]=a.seq;else if(a.seq>(PS[u]||0)){PS[u]=a.seq;proc(u,a)}}first=0}))}
/* --- client --- */
const send=o=>set(R("action/"+UID),{...o,seq:Math.max(Date.now(),++aseq)}).then(()=>aseq=Math.max(aseq,Date.now())).catch(()=>note("Gagal kirim aksi"));
const cd=(c,cls="",i="")=>`<div class="cd ${c.c==="W"?"W":""} ${cls}" ${i!==""?`data-i="${i}"`:""} style="${c.c==="W"?"":"background:"+CL[c.c]}"><b style="color:${c.c==="W"?"#222":CL[c.c]}">${lab(c)}</b></div>`;
function unoSync(){const P=pub;if(!P||!S.meta||S.meta.status!=="playing")return;const mi=P.uids.indexOf(UID),my=P.cur===mi&&!P.over&&!P.out[mi],hd=hand||[];
 $("opp").innerHTML=P.names.map((n,i)=>i===mi?"":`<div class="op ${P.cur===i&&!P.over?"t":""} ${P.out[i]?"x":""}">${esc(n)}<b>${P.out[i]?"OUT":P.cnt[i]}</b></div>`).join("");
 $("um").textContent=P.log;$("dn").textContent=P.deckN+" kartu";$("tp").innerHTML=cd(P.top,"big");$("ring").style.background=CL[P.col];$("dir").textContent=P.dir>0?"↻":"↺";$("pd").textContent=P.pend?"+"+P.pend+" TUMPUK!":"";
 $("hand").innerHTML=hd.map((c,i)=>cd(c,my&&ok(c,P)?"ok":"",i)).join("");$("skip").style.display=my&&P.drew?"block":"none";
 $("dp").style.boxShadow=my&&!P.pend&&!P.drew&&!hd.some(c=>ok(c,P))?"0 0 16px 4px var(--g)":"";
 if(P.over&&!shown){shown=1;later(()=>dlg(`<div style="font-size:3rem">🃏</div><h2 class="f" style="color:var(--g)">${esc(P.wtxt)}</h2><div class="row">${S.host?'<button class="b" data-a="again">MAIN LAGI</button>':'<small style="color:#9ab">Menunggu host...</small>'}<button class="b r" data-a="x">KELUAR</button></div>`,{again:()=>{unoInit()},x:leave}),500)}
 if(!P.over&&shown){shown=0;hide()}}
$("hand").onclick=e=>{const el=e.target.closest(".cd"),P=pub;if(!el||!P||P.over||P.cur!==P.uids.indexOf(UID))return;const i=+el.dataset.i,c=hand[i];if(!c||!ok(c,P))return;
 if(c.c==="W")dlg(`<h3 class="f">Pilih warna</h3><div class="row">${Object.entries(CL).map(([k,v])=>`<button class="ch" style="background:${v}" data-a="c" data-k="${k}"></button>`).join("")}</div>`,{c:d=>{hide();send({type:"play",i,col:d.k})}});
 else if(c.v==="7")dlg(`<h3 class="f">Tukar kartu dengan?</h3><div class="row">${P.names.map((n,x)=>x===P.uids.indexOf(UID)||P.out[x]?"":`<button class="b s" data-a="t" data-x="${x}">${esc(n)} (${P.cnt[x]})</button>`).join("")}</div>`,{t:d=>{hide();send({type:"play",i,t:+d.x})}});
 else send({type:"play",i})};
$("dp").onclick=()=>{const P=pub;if(P&&!P.over&&P.cur===P.uids.indexOf(UID)&&!P.pend&&!P.drew)send({type:"draw"})};
$("skip").onclick=()=>{const P=pub;if(P&&P.drew&&P.cur===P.uids.indexOf(UID))send({type:"skip"})};
</script></body></html>
